<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatomizer - Topics to Discuss</title>
  <style>
    .single-card-layout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .bomb-clock-zone {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(20, 14, 38, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: visible;
    }

    .bomb-clock-zone.is-hidden {
      display: none;
    }

    .bomb-clock-stage {
      position: relative;
      width: 170px;
      height: 170px;
      display: grid;
      place-items: center;
    }

    .bomb-clock-assembly {
      position: relative;
      width: 120px;
      height: 128px;
    }

    .clock-bell {
      position: absolute;
      top: 4px;
      width: 34px;
      height: 22px;
      background: linear-gradient(145deg, #ffd166, #f77f00);
      border: 3px solid #2b193d;
      border-radius: 20px 20px 6px 6px;
      z-index: 1;
    }

    .clock-bell--left {
      left: 8px;
      transform: rotate(-32deg);
    }

    .clock-bell--right {
      right: 8px;
      transform: rotate(32deg);
    }

    .clock-hammer {
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 18px;
      margin-left: -4px;
      background: #ff4d6d;
      border: 2px solid #2b193d;
      border-radius: 4px;
      z-index: 2;
    }

    .clock-body {
      position: relative;
      margin-top: 16px;
      width: 120px;
      height: 102px;
      border-radius: 50% / 46%;
      background: linear-gradient(160deg, #ff3b6b, #b5179e);
      border: 4px solid #2b193d;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      display: grid;
      place-items: center;
      z-index: 3;
    }

    .clock-face {
      width: 88px;
      height: 76px;
      border-radius: 46%;
      background: #fff9ec;
      border: 3px solid #2b193d;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock-countdown {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 800;
      font-size: 1.05rem;
      color: #1d1128;
      background: rgba(255, 249, 236, 0.9);
      padding: 2px 6px;
      border-radius: 8px;
      z-index: 4;
    }

    .clock-hands {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .clock-hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 999px;
    }

    .clock-hand--hour {
      width: 4px;
      height: 18px;
      margin-left: -2px;
      background: #2b193d;
      transform: rotate(-45deg);
    }

    .clock-hand--minute {
      width: 3px;
      height: 25px;
      margin-left: -1.5px;
      background: #2b193d;
      transform: rotate(65deg);
    }

    .clock-hand--second {
      width: 2px;
      height: 28px;
      margin-left: -1px;
      background: #e63946;
      transform: rotate(0deg);
    }

    .clock-foot {
      position: absolute;
      bottom: 0;
      width: 22px;
      height: 12px;
      background: #ffd166;
      border: 3px solid #2b193d;
      border-radius: 0 0 10px 10px;
      z-index: 2;
    }

    .clock-foot--left {
      left: 20px;
      transform: rotate(18deg);
    }

    .clock-foot--right {
      right: 20px;
      transform: rotate(-18deg);
    }

    .clock-gear {
      position: absolute;
      right: -8px;
      bottom: 18px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px dashed #ffd166;
      background: #3a0ca3;
      z-index: 4;
    }

    .bomb-clock-zone.is-danger .clock-body {
      box-shadow: 0 0 24px rgba(255, 59, 107, 0.9), 0 0 42px rgba(255, 209, 102, 0.55);
    }

    .bomb-clock-zone.is-danger .clock-countdown {
      color: #d90429;
    }

    .bomb-clock-assembly.is-shaking {
      animation: vigShake 0.09s infinite linear;
    }

    @keyframes vigShake {
      0%   { transform: translate(-4px, -3px) rotate(-5deg); }
      25%  { transform: translate(5px, -4px) rotate(6deg); }
      50%  { transform: translate(-5px, 4px) rotate(-6deg); }
      75%  { transform: translate(4px, 3px) rotate(5deg); }
      100% { transform: translate(-3px, 2px) rotate(-4deg); }
    }

    .bomb-clock-assembly.is-exploded [data-piece] {
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s ease;
      opacity: 0.95;
    }

    .bomb-clock-assembly.is-exploded .clock-bell--left {
      transform: translate(-85px, -75px) rotate(-135deg);
    }

    .bomb-clock-assembly.is-exploded .clock-bell--right {
      transform: translate(90px, -80px) rotate(140deg);
    }

    .bomb-clock-assembly.is-exploded .clock-hammer {
      transform: translate(12px, -95px) rotate(95deg);
    }

    .bomb-clock-assembly.is-exploded .clock-body {
      transform: translate(0px, -12px) scale(1.08) rotate(14deg);
    }

    .bomb-clock-assembly.is-exploded .clock-hands {
      transform: translate(65px, -45px) rotate(210deg);
    }

    .bomb-clock-assembly.is-exploded .clock-foot--left {
      transform: translate(-75px, 65px) rotate(-110deg);
    }

    .bomb-clock-assembly.is-exploded .clock-foot--right {
      transform: translate(80px, 60px) rotate(115deg);
    }

    .bomb-clock-assembly.is-exploded .clock-gear {
      transform: translate(95px, -20px) rotate(320deg);
    }

    .clock-exploded-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(20, 10, 32, 0.85);
      border-radius: 16px;
      z-index: 10;
    }

    .clock-exploded-banner[hidden] {
      display: none;
    }

    .clock-exploded-banner span {
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #ffd166;
      font-size: 1.05rem;
    }

    .clock-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clock-length-row,
    .clock-presets,
    .clock-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .clock-length-label {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .clock-btn,
    .clock-preset {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .clock-preset {
      flex: 1;
      text-align: center;
    }

    .clock-preset.is-active,
    .clock-btn--start,
    .clock-btn--primary {
      background: linear-gradient(135deg, #ff3b6b, #f77f00);
      border-color: transparent;
    }

    .clock-actions .clock-btn--start {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="singleCardContainer" class="single-card-layout">
    <div id="singleCardPromptArea">
      <!-- Keep your existing single-card prompt UI here -->
    </div>

    <div id="chatomizer-bomb-clock-zone" class="bomb-clock-zone is-hidden" aria-live="polite">
      <div id="bombClockStage" class="bomb-clock-stage">
        <div id="bombClockAssembly" class="bomb-clock-assembly">
          <div class="clock-bell clock-bell--left" data-piece></div>
          <div class="clock-bell clock-bell--right" data-piece></div>
          <div class="clock-hammer" data-piece></div>

          <div class="clock-body" data-piece>
            <div class="clock-face">
              <div class="clock-hands" data-piece>
                <span class="clock-hand clock-hand--hour"></span>
                <span class="clock-hand clock-hand--minute"></span>
                <span class="clock-hand clock-hand--second" id="clockSecondHand"></span>
              </div>
              <div id="clockCountdownDisplay" class="clock-countdown">00:30</div>
            </div>
          </div>

          <div class="clock-foot clock-foot--left" data-piece></div>
          <div class="clock-foot clock-foot--right" data-piece></div>
          <div class="clock-gear" data-piece></div>
        </div>

        <div id="clockExplodedBanner" class="clock-exploded-banner" hidden>
          <span>TIME'S UP!</span>
          <button type="button" id="clockResetBtn" class="clock-btn clock-btn--primary">Rebuild Clock</button>
        </div>
      </div>

      <div class="clock-controls">
        <div class="clock-length-row">
          <button type="button" id="clockMinusBtn" class="clock-btn clock-btn--icon" aria-label="Decrease timer by 5 seconds">-5s</button>
          <span id="clockLengthLabel" class="clock-length-label">Length: 30s</span>
          <button type="button" id="clockPlusBtn" class="clock-btn clock-btn--icon" aria-label="Increase timer by 5 seconds">+5s</button>
        </div>

        <div class="clock-presets">
          <button type="button" class="clock-preset" data-seconds="15">15s</button>
          <button type="button" class="clock-preset is-active" data-seconds="30">30s</button>
          <button type="button" class="clock-preset" data-seconds="60">60s</button>
        </div>

        <div class="clock-actions">
          <button type="button" id="clockStartPauseBtn" class="clock-btn clock-btn--start">Start</button>
          <button type="button" id="clockResetSmallBtn" class="clock-btn clock-btn--ghost">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const zone = document.getElementById('chatomizer-bomb-clock-zone');
      const assembly = document.getElementById('bombClockAssembly');
      const display = document.getElementById('clockCountdownDisplay');
      const secondHand = document.getElementById('clockSecondHand');
      const lengthLabel = document.getElementById('clockLengthLabel');
      const startPauseBtn = document.getElementById('clockStartPauseBtn');
      const resetSmallBtn = document.getElementById('clockResetSmallBtn');
      const resetBtn = document.getElementById('clockResetBtn');
      const minusBtn = document.getElementById('clockMinusBtn');
      const plusBtn = document.getElementById('clockPlusBtn');
      const banner = document.getElementById('clockExplodedBanner');
      const presets = Array.from(document.querySelectorAll('.clock-preset'));

      if (!zone || !assembly || !display) return;

      let durationSec = 30;
      let remainingSec = 30;
      let timerId = null;
      let isRunning = false;

      function formatTime(sec) {
        const safe = Math.max(0, Math.ceil(sec));
        const mins = Math.floor(safe / 60);
        const rem = safe % 60;
        return String(mins).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
      }

      function updateVisuals() {
        display.textContent = formatTime(remainingSec);
        if (lengthLabel) {
          lengthLabel.textContent = 'Length: ' + durationSec + 's';
        }

        const progress = durationSec > 0 ? remainingSec / durationSec : 0;
        const angle = (1 - progress) * 360;
        if (secondHand) {
          secondHand.style.transform = 'rotate(' + angle + 'deg)';
        }

        zone.classList.toggle('is-danger', remainingSec > 0 && remainingSec <= 5);
      }

      function clearTicker() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        isRunning = false;
        if (startPauseBtn) {
          startPauseBtn.textContent = 'Start';
        }
      }

      function rebuildClock() {
        clearTicker();
        remainingSec = durationSec;
        assembly.classList.remove('is-shaking', 'is-exploded');
        if (banner) {
          banner.hidden = true;
        }
        updateVisuals();
      }

      function triggerExplosion() {
        clearTicker();
        remainingSec = 0;
        updateVisuals();
        assembly.classList.add('is-shaking');

        setTimeout(() => {
          assembly.classList.remove('is-shaking');
          assembly.classList.add('is-exploded');
          if (banner) {
            banner.hidden = false;
          }
        }, 650);
      }

      function setDuration(newSec) {
        durationSec = Math.min(300, Math.max(5, newSec));
        presets.forEach((btn) => {
          btn.classList.toggle('is-active', Number(btn.dataset.seconds) === durationSec);
        });
        rebuildClock();
      }

      if (startPauseBtn) {
        startPauseBtn.addEventListener('click', () => {
          if (assembly.classList.contains('is-exploded')) {
            rebuildClock();
          }

          if (isRunning) {
            clearTicker();
            return;
          }

          if (remainingSec <= 0) {
            remainingSec = durationSec;
          }

          isRunning = true;
          startPauseBtn.textContent = 'Pause';
          const startTime = performance.now();
          const initialRemaining = remainingSec;

          timerId = setInterval(() => {
            const elapsed = (performance.now() - startTime) / 1000;
            remainingSec = Math.max(0, initialRemaining - elapsed);
            updateVisuals();

            if (remainingSec <= 0) {
              triggerExplosion();
            }
          }, 100);
        });
      }

      if (minusBtn) minusBtn.addEventListener('click', () => setDuration(durationSec - 5));
      if (plusBtn) plusBtn.addEventListener('click', () => setDuration(durationSec + 5));
      if (resetSmallBtn) resetSmallBtn.addEventListener('click', rebuildClock);
      if (resetBtn) resetBtn.addEventListener('click', rebuildClock);

      presets.forEach((btn) => {
        btn.addEventListener('click', () => setDuration(Number(btn.dataset.seconds)));
      });

      window.setChatomizerSingleCardMode = function (isSingleCard) {
        zone.classList.toggle('is-hidden', !isSingleCard);
        if (!isSingleCard) {
          rebuildClock();
        }
      };

      updateVisuals();
    })();
  </script>
</body>
</html>
