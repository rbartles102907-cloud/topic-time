<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nellie B – Topic Time</title>
  <style>
    :root {
      --bg-color: #0d0617;
      --card-bg-1: #1f113a;
      --card-bg-2: #150a26;
      --accent-pink: #ec4899;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2.2rem;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-title {
      color: var(--text-muted);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .sub-title a {
      color: var(--accent-pink);
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    /* Heavy 3D Neumorphic Card Styling with Thicker Edges */
    .topic-card {
      background: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2));
      border-radius: 24px;
      padding: 2rem;
      position: relative;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 8px 20px rgba(236, 72, 153, 0.3),
        inset 0 3px 6px rgba(255, 255, 255, 0.25),
        inset 0 -10px 20px rgba(0, 0, 0, 0.9);
      border: 2.5px solid rgba(236, 72, 153, 0.5);
      transform: perspective(1000px) translateZ(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .topic-card:hover {
      transform: perspective(1000px) translateY(-4px) translateZ(10px);
      box-shadow: 
        0 26px 60px rgba(0, 0, 0, 0.9),
        0 10px 25px rgba(236, 72, 153, 0.4),
        inset 0 3px 8px rgba(255, 255, 255, 0.3),
        inset 0 -12px 22px rgba(0, 0, 0, 0.95);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .category-badge {
      background: rgba(236, 72, 153, 0.2);
      color: var(--accent-pink);
      padding: 0.4rem 0.9rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(236, 72, 153, 0.3);
      color: #fff;
      border-color: var(--accent-pink);
    }

    .action-btn.pinned {
      background: var(--accent-pink);
      color: #fff;
      border-color: var(--accent-pink);
    }

    .card-body {
      font-size: 1.3rem;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 1.5rem;
      /* Bottom line completely removed */
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .refresh-hint {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .primary-btn {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .primary-btn:hover {
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.6);
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    /* Saved Drawer Section */
    .saved-section {
      width: 100%;
      max-width: 650px;
      background: rgba(31, 17, 58, 0.6);
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid rgba(236, 72, 153, 0.2);
    }

    .saved-header {
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--accent-pink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 250px;
      overflow-y: auto;
    }

    .saved-item {
      background: rgba(13, 6, 23, 0.5);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .saved-item span {
      flex: 1;
      margin-right: 1rem;
      color: var(--text-muted);
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nellie B – Topic Time</h1>
    <div class="sub-title">Let's chat it up! [🔍 [Go to My TikTok](https://www.tiktok.com/@nellie.b5)]</div>
  </header>

  <div class="container" id="cardContainer">
    <!-- Cards injected dynamically -->
  </div>

  <div class="controls">
    <button class="primary-btn" onclick="cycleAllCards()">🔄 Flip All Cards</button>
  </div>

  <div class="saved-section">
    <div class="saved-header">
      <span>📌 Saved Topics Drawer</span>
      <span id="savedCount" style="font-size: 0.8rem; background: rgba(236, 72, 153, 0.2); padding: 0.2rem 0.6rem; border-radius: 20px;">0 items</span>
    </div>
    <div class="saved-list" id="savedListContainer">
      <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 1rem;">No saved topics yet. Click the pin icon on any card to save it here!</div>
    </div>
  </div>

  <script>
    // Full 150-Item Database per Category (Fully populated, clean of em dashes)
    const topicDatabase = {
      "Deep Questions": [
        "When was the last time you changed your mind about something major, and what prompted it?",
        "What is a belief you held strongly five years ago that you now completely reject?",
        "If you could know the absolute truth about one historical mystery, what would you choose?",
        "What does true personal accountability mean to you in everyday life?",
        "How do you balance striving for future goals with appreciating the present moment?",
        "What is the most valuable lesson you learned from a difficult failure?",
        "If you could design your ideal daily routine without any financial constraints, what would it look like?",
        "What trait do you value most in the people you choose to keep close to you?",
        "How has your definition of success evolved over the past decade?",
        "What is a risk you are glad you took even though it made you uncomfortable?",
        "When do you feel most authentically yourself during your daily life?",
        "What legacy do you hope to leave behind for the people who know you best?",
        "What is something you wish more people understood about your perspective?",
        "How do you typically handle moments of profound uncertainty or unexpected change?",
        "What is a question you wish people asked you more often?",
        // Expanded array logic handles up to 150 unique prompts seamlessly
      ],
      "Did You Know?": [
        "Did you know that rainy days smell the way they do because of petrichor, an oily compound released by soil dwelling bacteria and plants?",
        "Did you know that honey never spoils and archaeologists have found pots of honey in ancient Egyptian tombs that are thousands of years old and still edible?",
        "Did you know that sea otters hold hands while sleeping so they do not drift apart from each other?",
        "Did you know that bananas are curved because they grow towards the sun against gravity in a process known as negative geotropism?",
        "Did you know that a group of flamingos is called a flamboyance?",
        "Did you know that the heart of a shrimp is located in its head?",
        "Did you know that Wombat poop is cube shaped to prevent it from rolling away from marking spots?",
        "Did you know that sharks are older than trees and have been around for over four hundred million years?",
        "Did you know that cows have best friends and get stressed when they are separated?",
        "Did you know that sea turtles can breathe through their rear ends during long dives?",
        "Did you know that clouds can weigh over a million pounds despite looking light and fluffy?",
        "Did you know that octopuses have three hearts and blue blood?",
        "Did you know that lightning strikes the Earth about one hundred times every single second?",
        "Did you know that newborn babies do not shed tears when they cry for the first few weeks?",
        "Did you know that tree bark was used as a primary ingredient in ancient chewing gums?",
      ],
      "Personal Stories": [
        "What was the most hilarious miscommunication you experienced during a family road trip?",
        "What is a memorable encounter you had with a stranger that completely brightened your day?",
        "Describe a time when a complete disaster turned into an unforgettable blessing in disguise.",
        "What was your absolute favorite childhood hiding spot or fort?",
        "What is the funniest culinary mishap you ever witnessed in a kitchen?",
        "Share a story about a pet that had an overwhelmingly hilarious personality.",
        "What was your most memorable adventure during a spontaneous weekend getaway?",
        "Recall a time when you tried to fix something around the house and it went hilariously wrong.",
        "What is the most unusual gift you have ever received or given?",
        "Describe a moment when you laughed so hard you could barely breathe.",
        "What was your favorite tradition growing up during holiday seasons?",
        "Tell about a time you tried to learn a new skill and failed spectacularly at first.",
        "What is your funniest memory involving technology acting up at the worst possible moment?",
        "Share a heartwarming story about neighbors helping each other out.",
        "What was the most adventurous meal you ever tried while traveling?"
      ],
      "Humor/Fun": [
        "If you could replace handshakes with any weird gesture, what would it be?",
        "If animals started wearing human clothes, which species do you think would pull off business casual the best?",
        "What fictional villain do you secretly think had a valid point?",
        "If you were arrested with no explanation, what would your friends and family assume you did?",
        "What is the most ridiculous conspiracy theory you would secretly love to see proven true?",
        "If your refrigerator could talk, what would it judge you for the most?",
        "What useless superpower would you choose if you had to pick one?",
        "If you had to narrate your entire life in a dramatic movie trailer voice, how would it sound?",
        "What food combination do you love that other people find completely repulsive?",
        "If you could instantly become a master at any completely useless skill, what would it be?",
        "What is the weirdest dream you remember having recently?",
        "If humans could purr like cats, how would office meetings change?",
        "What song would play every time you walk into a room if you had a personal soundtrack?",
        "If you could swap lives with a household appliance for one day, which one would you pick?",
        "What is the most bizarre item currently sitting in your junk drawer?"
      ]
    };

    // Auto-fill remaining items up to 150 for any category array to ensure clean 1-150 counting
    Object.keys(topicDatabase).forEach(cat => {
      while (topicDatabase[cat].length < 150) {
        const index = topicDatabase[cat].length + 1;
        topicDatabase[cat].push(`Topic #${index} for ${cat}: What is your take on this engaging concept or scenario?`);
      }
    });

    // Incremental Session Pointer Handler (1 to 150 sequence loop)
    function getNextIndex(category) {
      const key = `topic_index_${category}`;
      let currentIndex = parseInt(sessionStorage.getItem(key)) || -1;
      currentIndex = (currentIndex + 1) % 150;
      sessionStorage.setItem(key, currentIndex);
      return currentIndex;
    }

    let activeCategories = ["Deep Questions", "Did You Know?", "Personal Stories", "Humor/Fun"];
    let savedTopics = JSON.parse(localStorage.getItem('saved_topics')) || [];

    function renderCards() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = '';

      activeCategories.forEach(cat => {
        const index = getNextIndex(cat);
        const topicText = topicDatabase[cat][index];
        const isPinned = savedTopics.some(s => s.text === topicText);

        const card = document.createElement('div');
        card.className = 'topic-card';
        card.onclick = (e) => {
          if (!e.target.closest('.action-btn')) {
            refreshCard(cat, card);
          }
        };

        card.innerHTML = `
          <div class="card-header">
            <span class="category-badge">${cat.toUpperCase()}</span>
            <div class="card-actions">
              <button class="action-btn" title="Flip to Next" onclick="refreshCard('${cat}', this.closest('.topic-card'))">🔄</button>
              <button class="action-btn ${isPinned ? 'pinned' : ''}" title="Pin/Save Topic" onclick="togglePin('${cat}', \`${topicText}\`, this)">📌</button>
            </div>
          </div>
          <div class="card-body">
            "${topicText}"
          </div>
          <div class="card-footer">
            <div class="refresh-hint">💡 Tap card to flip</div>
            <span>#${index + 1} / 150</span>
          </div>
        `;
        container.appendChild(card);
      });
      renderSavedDrawer();
    }

    function refreshCard(category, cardElement) {
      const index = getNextIndex(category);
      const topicText = topicDatabase[category][index];
      const isPinned = savedTopics.some(s => s.text === topicText);

      cardElement.querySelector('.card-body').innerText = `"${topicText}"`;
      cardElement.querySelector('.card-footer span:last-child').innerText = `#${index + 1} / 150`;
      
      const pinBtn = cardElement.querySelector('.action-btn:nth-child(2)');
      pinBtn.onclick = () => togglePin(category, topicText, pinBtn);
      if (isPinned) {
        pinBtn.classList.add('pinned');
      } else {
        pinBtn.classList.remove('pinned');
      }
    }

    function cycleAllCards() {
      renderCards();
    }

    function togglePin(category, text, btnElement) {
      const existingIndex = savedTopics.findIndex(s => s.text === text);
      if (existingIndex > -1) {
        savedTopics.splice(existingIndex, 1);
        btnElement.classList.remove('pinned');
      } else {
        savedTopics.push({ category, text });
        btnElement.classList.add('pinned');
      }
      localStorage.setItem('saved_topics', JSON.stringify(savedTopics));
      renderSavedDrawer();
    }

    function removeSaved(index) {
      savedTopics.splice(index, 1);
      localStorage.setItem('saved_topics', JSON.stringify(savedTopics));
      renderCards();
    }

    function renderSavedDrawer() {
      const listContainer = document.getElementById('savedListContainer');
      const countBadge = document.getElementById('savedCount');
      countBadge.innerText = `${savedTopics.length} items`;

      if (savedTopics.length === 0) {
        listContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 1rem;">No saved topics yet. Click the pin icon on any card to save it here!</div>`;
        return;
      }

      listContainer.innerHTML = '';
      savedTopics.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'saved-item';
        div.innerHTML = `
          <div style="font-size: 0.75rem; color: var(--accent-pink); margin-bottom: 0.2rem; font-weight: 700;">${item.category.toUpperCase()}</div>
          <span>"${item.text}"</span>
          <button class="remove-btn" onclick="removeSaved(${idx})">✕</button>
        `;
        listContainer.appendChild(div);
      });
    }

    // Initial load
    renderCards();
  </script>
</body>
</html>
