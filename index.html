<script>
  // Increment this whenever the user changes language so stale async calls abort cleanly
  var languageSwitchSeq = 0;

  // Helper to format any category name using your existing category translation helper
  function formatCardCategory(rawCategory) {
    if (!rawCategory) return "";
    if (typeof translateCategoryLabel === "function") {
      return translateCategoryLabel(rawCategory);
    }
    return String(rawCategory).toUpperCase();
  }

  // Deterministic lookup for the active language (no accidental English overwrite)
  function getTranslatedTopicText(topic, langOverride) {
    var lang = langOverride || currentLanguage || "en";
    if (!topic || !topic.text) return "";
    if (lang === "en") return topic.text;

    var cacheKey = lang + "::" + topic.text;
    if (typeof translationCache !== "undefined" && translationCache[cacheKey]) {
      return translationCache[cacheKey];
    }
    if (typeof fallbackTranslateText === "function") {
      return fallbackTranslateText(topic.text, lang);
    }
    return topic.text;
  }

  // Build the face-down card back markup with 100% translated UI strings
  function getDeckBackMarkup(topic, index) {
    var categoryText = formatCardCategory(topic && topic.category ? topic.category : "");
    var topActionText = t("Tap to Flip");
    var centerBadgeText = t("Topic");
    var revealHintText = t("Click card to reveal question");

    return (
      '<div class="card-back-inner">' +
        '<div class="card-back-top-row">' +
          '<span class="card-back-action">' + escapeHtml(topActionText) + '</span>' +
        '</div>' +
        '<div class="card-back-center">' +
          '<div class="card-back-avatar-wrap">' +
            '<img src="nellie-avatar.png" alt="Nellie B" class="card-back-avatar" />' +
            '<span class="card-back-pill">' + escapeHtml(centerBadgeText) + '</span>' +
          '</div>' +
          '<div class="card-back-topic-label">' + escapeHtml(t("Topic")) + '</div>' +
          '<div class="card-back-category-badge">' + escapeHtml(categoryText) + '</div>' +
        '</div>' +
        '<div class="card-back-footer">' +
          '<span class="card-back-hint">' + escapeHtml(revealHintText) + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  // Refresh visible cards safely across immediate and async translation phases
  async function refreshVisibleCardTranslations() {
    var seq = ++languageSwitchSeq;
    var targetLang = currentLanguage || "en";

    // 1. Render immediately using dictionary/cache/fallback so both backs and fronts switch at once
    renderTopicCards();

    if (targetLang === "en") {
      return;
    }

    // 2. Resolve any async translations for the currently displayed topics
    if (Array.isArray(currentTopics) && typeof resolveTranslatedTopicText === "function") {
      await Promise.all(
        currentTopics.map(function(tp) {
          if (!tp || !tp.text) return Promise.resolve("");
          return resolveTranslatedTopicText(tp, targetLang);
        })
      );
    }

    // 3. Abort if the user changed language again while promises were in flight
    if (seq !== languageSwitchSeq || (currentLanguage || "en") !== targetLang) {
      return;
    }

    // 4. Update face-up question text elements without disturbing face-down backs or active typing timers
    for (var idx = 0; idx < currentTopics.length; idx++) {
      var item = currentTopics[idx];
      if (!item) continue;

      var isFaceDown = (typeof cardCountView !== "undefined" && cardCountView === 4 && !cardRevealedStates[idx]);
      if (isFaceDown) continue;

      var questionEl = document.getElementById("typed-question-" + idx);
      var isActivelyTyping =
        typeof cardTypingTimers !== "undefined" &&
        cardTypingTimers &&
        Boolean(cardTypingTimers[idx]);

      if (questionEl && !isActivelyTyping) {
        var resolvedText = getTranslatedTopicText(item, targetLang);
        questionEl.innerHTML = "&quot;" + escapeHtml(resolvedText) + "&quot;";
      }
    }
  }

  // Central language setter used by both the dropdown and the quick-toggle button
  function setLanguage(langCode) {
    languageSwitchSeq += 1;
    var nextLang = (typeof UI_TRANSLATIONS !== "undefined" && UI_TRANSLATIONS[langCode])
      ? langCode
      : "en";

    currentLanguage = nextLang;
    try {
      localStorage.setItem("nellieb_lang", currentLanguage);
    } catch (e) {
      // Ignore storage errors in restricted contexts
    }

    var selectEl = document.getElementById("language-select");
    if (selectEl && selectEl.value !== currentLanguage) {
      selectEl.value = currentLanguage;
    }

    if (typeof applyLanguageTranslations === "function") {
      applyLanguageTranslations();
    }

    refreshVisibleCardTranslations();

    if (typeof showToast === "function") {
      var langLabel = "English";
      if (selectEl && selectEl.selectedIndex >= 0 && selectEl.options[selectEl.selectedIndex]) {
        langLabel = selectEl.options[selectEl.selectedIndex].text;
      } else if (currentLanguage === "es") {
        langLabel = "Español";
      }

      showToast(
        currentLanguage === "es"
          ? "Idioma cambiado a Español"
          : "Language switched to " + langLabel,
        "info"
      );
    }
  }
</script>
