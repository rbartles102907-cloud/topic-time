<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatomizer - Topics to Discuss</title>
  <style>
    :root {
      --bg-top: #261447;
      --bg-bottom: #0d081a;
      --panel-bg: rgba(24, 15, 46, 0.88);
      --panel-border: rgba(255, 255, 255, 0.14);
      --card-bg: #fffdf9;
      --card-ink: #1a1026;
      --accent-pink: #ff3b6b;
      --accent-orange: #f77f00;
      --accent-gold: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      background: radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bottom) 70%);
      padding: 28px 20px 60px;
    }

    .app-wrap {
      max-width: 1220px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-radius: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    select,
    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(15, 9, 31, 0.9);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover,
    select:hover {
      border-color: rgba(255, 255, 255, 0.42);
    }

    .btn.is-active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      border-color: transparent;
    }

    .btn--primary {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      border-color: transparent;
    }

    .status-line {
      text-align: center;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 26px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    @media (max-width: 980px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .cards-grid.is-hidden {
      display: none;
    }

    .single-stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .single-stage.is-hidden {
      display: none;
    }

    .topic-card {
      background: var(--card-bg);
      color: var(--card-ink);
      border-radius: 22px;
      padding: 24px 22px;
      min-height: 215px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.45);
    }

    .single-card-box {
      flex: 1 1 420px;
      max-width: 600px;
      min-height: 260px;
      padding: 32px 28px;
      justify-content: space-between;
    }

    .category-pill {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      background: #ffe3ec;
      color: #b0123d;
      margin-bottom: 16px;
    }

    .topic-text {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .single-card-box .topic-text {
      font-size: 1.38rem;
      margin-bottom: 24px;
    }

    .single-card-footer {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Alarm Clock Bomb Timer on Right of Single Card */
    .alarm-bomb-panel {
      width: 255px;
      flex-shrink: 0;
      padding: 18px 16px;
      border-radius: 22px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      overflow: visible;
    }

    .alarm-bomb-panel.is-hidden {
      display: none;
    }

    .clock-arena {
      position: relative;
      width: 184px;
      height: 184px;
      display: grid;
      place-items: center;
      overflow: visible;
    }

    .alarm-clock {
      position: relative;
      width: 122px;
      height: 130px;
    }

    .bell {
      position: absolute;
      top: 4px;
      width: 34px;
      height: 22px;
      background: linear-gradient(145deg, var(--accent-gold), var(--accent-orange));
      border: 3px solid #231233;
      border-radius: 20px 20px 6px 6px;
      z-index: 1;
    }

    .bell--left {
      left: 8px;
      transform: rotate(-32deg);
    }

    .bell--right {
      right: 8px;
      transform: rotate(32deg);
    }

    .hammer {
      position: absolute;
      top: -5px;
      left: 50%;
      width: 8px;
      height: 18px;
      margin-left: -4px;
      background: #ff4d6d;
      border: 2px solid #231233;
      border-radius: 4px;
      z-index: 2;
    }

    .clock-casing {
      position: relative;
      margin-top: 16px;
      width: 122px;
      height: 104px;
      border-radius: 50% / 46%;
      background: linear-gradient(160deg, var(--accent-pink), #a6148e);
      border: 4px solid #231233;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
      display: grid;
      place-items: center;
      z-index: 3;
    }

    .clock-dial {
      width: 90px;
      height: 78px;
      border-radius: 46%;
      background: #fff9ec;
      border: 3px solid #231233;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock-hands-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 999px;
    }

    .hand--hour {
      width: 4px;
      height: 18px;
      margin-left: -2px;
      background: #231233;
      transform: rotate(-48deg);
    }

    .hand--minute {
      width: 3px;
      height: 25px;
      margin-left: -1.5px;
      background: #231233;
      transform: rotate(62deg);
    }

    .hand--second {
      width: 2px;
      height: 28px;
      margin-left: -1px;
      background: #e63946;
      transform: rotate(0deg);
    }

    .clock-readout {
      position: relative;
      z-index: 4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--card-ink);
      background: rgba(255, 249, 236, 0.92);
      padding: 2px 6px;
      border-radius: 8px;
    }

    .clock-leg {
      position: absolute;
      bottom: 0;
      width: 22px;
      height: 12px;
      background: var(--accent-gold);
      border: 3px solid #231233;
      border-radius: 0 0 10px 10px;
      z-index: 2;
    }

    .clock-leg--left {
      left: 20px;
      transform: rotate(18deg);
    }

    .clock-leg--right {
      right: 20px;
      transform: rotate(-18deg);
    }

    .clock-spring-gear {
      position: absolute;
      right: -8px;
      bottom: 18px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px dashed var(--accent-gold);
      background: #3a0ca3;
      z-index: 4;
    }

    .alarm-bomb-panel.is-hot .clock-casing {
      box-shadow: 0 0 24px rgba(255, 59, 107, 0.9), 0 0 42px rgba(255, 209, 102, 0.55);
    }

    .alarm-bomb-panel.is-hot .clock-readout {
      color: #c9002b;
    }

    .alarm-clock.is-shaking {
      animation: clockShakeHard 0.08s infinite linear;
    }

    @keyframes clockShakeHard {
      0%   { transform: translate(-5px, -4px) rotate(-7deg); }
      25%  { transform: translate(6px, -4px) rotate(7deg); }
      50%  { transform: translate(-6px, 5px) rotate(-7deg); }
      75%  { transform: translate(5px, 4px) rotate(6deg); }
      100% { transform: translate(-4px, 3px) rotate(-5deg); }
    }

    .alarm-clock.is-broken [data-part] {
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s ease;
      opacity: 0.95;
    }

    .alarm-clock.is-broken .bell--left {
      transform: translate(-92px, -82px) rotate(-145deg);
    }

    .alarm-clock.is-broken .bell--right {
      transform: translate(96px, -84px) rotate(150deg);
    }

    .alarm-clock.is-broken .hammer {
      transform: translate(12px, -104px) rotate(105deg);
    }

    .alarm-clock.is-broken .clock-casing {
      transform: translate(0px, -12px) scale(1.08) rotate(15deg);
    }

    .alarm-clock.is-broken .clock-hands-layer {
      transform: translate(72px, -48px) rotate(225deg);
    }

    .alarm-clock.is-broken .clock-leg--left {
      transform: translate(-80px, 72px) rotate(-115deg);
    }

    .alarm-clock.is-broken .clock-leg--right {
      transform: translate(86px, 68px) rotate(120deg);
    }

    .alarm-clock.is-broken .clock-spring-gear {
      transform: translate(102px, -24px) rotate(330deg);
    }

    .blast-overlay {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: rgba(18, 9, 30, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    .blast-overlay[hidden] {
      display: none;
    }

    .blast-label {
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--accent-gold);
      font-size: 1.05rem;
    }

    .clock-ui {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .clock-mini-btn {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .clock-preset {
      flex: 1;
      text-align: center;
    }

    .clock-preset.is-active,
    .clock-start-btn,
    .clock-rebuild-btn {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
      border-color: transparent;
    }

    .clock-start-btn {
      flex: 1;
    }

    .clock-length-text {
      font-size: 0.82rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="top-bar">
      <h1 class="brand-title">Chatomizer - Topics to Discuss</h1>

      <div class="controls">
        <select id="categorySelect" aria-label="Category">
          <option value="all">All Categories</option>
          <option value="questions-general.json">General</option>
          <option value="questions-lifestyle-food.json">Lifestyle &amp; Food</option>
          <option value="questions-science-tech.json">Science &amp; Tech</option>
          <option value="questions-would-you-rather.json">Would You Rather</option>
          <option value="questions-current-events.json">Current Events</option>
          <option value="questions-personal-stories.json">Personal Stories</option>
          <option value="questions-philosophy.json">Philosophy</option>
          <option value="questions-deep-questions.json">Deep Questions</option>
          <option value="questions-humor-fun.json">Humor &amp; Fun</option>
          <option value="questions-pop-culture.json">Pop Culture</option>
          <option value="questions-music-fun-facts.json">Music &amp; Fun Facts</option>
        </select>

        <button type="button" id="oneCardBtn" class="btn">1 Card</button>
        <button type="button" id="fourCardsBtn" class="btn is-active">4 Cards</button>
        <button type="button" id="drawPromptBtn" class="btn btn--primary">Draw Prompt</button>
      </div>
    </header>

    <div id="statusLine" class="status-line">Loading prompts...</div>

    <section id="fourCardsGrid" class="cards-grid" aria-label="4 Cards"></section>

    <section id="singleCardStage" class="single-stage is-hidden" aria-label="1 Card">
      <article class="topic-card single-card-box">
        <div>
          <span id="singleCategory" class="category-pill">General</span>
          <p id="singleQuestion" class="topic-text">Click "Draw Prompt" to load a topic.</p>
        </div>
        <div class="single-card-footer">
          <button type="button" id="nextSingleBtn" class="btn btn--primary">Next Prompt</button>
        </div>
      </article>

      <aside id="alarmBombPanel" class="alarm-bomb-panel is-hidden" aria-live="polite">
        <div class="clock-arena">
          <div id="alarmClock" class="alarm-clock">
            <div class="bell bell--left" data-part></div>
            <div class="bell bell--right" data-part></div>
            <div class="hammer" data-part></div>

            <div class="clock-casing" data-part>
              <div class="clock-dial">
                <div class="clock-hands-layer" data-part>
                  <span class="hand hand--hour"></span>
                  <span class="hand hand--minute"></span>
                  <span class="hand hand--second" id="clockSecondHand"></span>
                </div>
                <span id="clockReadout" class="clock-readout">00:30</span>
              </div>
            </div>

            <div class="clock-leg clock-leg--left" data-part></div>
            <div class="clock-leg clock-leg--right" data-part></div>
            <div class="clock-spring-gear" data-part></div>
          </div>

          <div id="blastOverlay" class="blast-overlay" hidden>
            <span class="blast-label">BOOM! TIME'S UP</span>
            <button type="button" id="rebuildClockBtn" class="clock-mini-btn clock-rebuild-btn">Fix Clock</button>
          </div>
        </div>

        <div class="clock-ui">
          <div class="clock-row">
            <button type="button" id="minusFiveBtn" class="clock-mini-btn" aria-label="Subtract 5 seconds">-5s</button>
            <span id="clockLengthText" class="clock-length-text">30s</span>
            <button type="button" id="plusFiveBtn" class="clock-mini-btn" aria-label="Add 5 seconds">+5s</button>
          </div>

          <div class="clock-row">
            <button type="button" class="clock-mini-btn clock-preset" data-sec="15">15s</button>
            <button type="button" class="clock-mini-btn clock-preset is-active" data-sec="30">30s</button>
            <button type="button" class="clock-mini-btn clock-preset" data-sec="60">60s</button>
          </div>

          <div class="clock-row">
            <button type="button" id="startPauseClockBtn" class="clock-mini-btn clock-start-btn">Start</button>
            <button type="button" id="resetClockBtn" class="clock-mini-btn">Reset</button>
          </div>
        </div>
      </aside>
    </section>
  </div>

  <script>
    (() => {
      const DATA_FILES = [
        'questions-general.json',
        'questions-lifestyle-food.json',
        'questions-science-tech.json',
        'questions-would-you-rather.json',
        'questions-current-events.json',
        'questions-personal-stories.json',
        'questions-philosophy.json',
        'questions-deep-questions.json',
        'questions-humor-fun.json',
        'questions-pop-culture.json',
        'questions-music-fun-facts.json'
      ];

      const categorySelect = document.getElementById('categorySelect');
      const oneCardBtn = document.getElementById('oneCardBtn');
      const fourCardsBtn = document.getElementById('fourCardsBtn');
      const drawPromptBtn = document.getElementById('drawPromptBtn');
      const nextSingleBtn = document.getElementById('nextSingleBtn');
      const statusLine = document.getElementById('statusLine');

      const fourCardsGrid = document.getElementById('fourCardsGrid');
      const singleCardStage = document.getElementById('singleCardStage');
      const singleCategory = document.getElementById('singleCategory');
      const singleQuestion = document.getElementById('singleQuestion');

      const alarmBombPanel = document.getElementById('alarmBombPanel');
      const alarmClock = document.getElementById('alarmClock');
      const clockReadout = document.getElementById('clockReadout');
      const clockSecondHand = document.getElementById('clockSecondHand');
      const clockLengthText = document.getElementById('clockLengthText');
      const minusFiveBtn = document.getElementById('minusFiveBtn');
      const plusFiveBtn = document.getElementById('plusFiveBtn');
      const startPauseClockBtn = document.getElementById('startPauseClockBtn');
      const resetClockBtn = document.getElementById('resetClockBtn');
      const rebuildClockBtn = document.getElementById('rebuildClockBtn');
      const blastOverlay = document.getElementById('blastOverlay');
      const presetButtons = Array.from(document.querySelectorAll('.clock-preset'));

      let prompts = [];
      let singleMode = false;

      let durationSec = 30;
      let leftSec = 30;
      let intervalRef = null;
      let running = false;

      function formatClock(seconds) {
        const clamped = Math.max(0, Math.ceil(seconds));
        const mins = Math.floor(clamped / 60);
        const secs = clamped % 60;
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      }

      function renderClockState() {
        clockReadout.textContent = formatClock(leftSec);
        clockLengthText.textContent = durationSec + 's';
        const ratio = durationSec > 0 ? leftSec / durationSec : 0;
        const deg = (1 - ratio) * 360;
        if (clockSecondHand) {
          clockSecondHand.style.transform = 'rotate(' + deg + 'deg)';
        }
        alarmBombPanel.classList.toggle('is-hot', leftSec > 0 && leftSec <= 5);
      }

      function stopClockInterval() {
        if (intervalRef !== null) {
          clearInterval(intervalRef);
          intervalRef = null;
        }
        running = false;
        startPauseClockBtn.textContent = 'Start';
      }

      function resetClock() {
        stopClockInterval();
        leftSec = durationSec;
        alarmClock.classList.remove('is-shaking', 'is-broken');
        blastOverlay.hidden = true;
        renderClockState();
      }

      function explodeClock() {
        stopClockInterval();
        leftSec = 0;
        renderClockState();
        alarmClock.classList.add('is-shaking');
        setTimeout(() => {
          alarmClock.classList.remove('is-shaking');
          alarmClock.classList.add('is-broken');
          blastOverlay.hidden = false;
        }, 650);
      }

      function changeDuration(nextSec) {
        durationSec = Math.min(300, Math.max(5, nextSec));
        presetButtons.forEach((btn) => {
          btn.classList.toggle('is-active', Number(btn.dataset.sec) === durationSec);
        });
        resetClock();
      }

      function applyMode(isSingle) {
        singleMode = Boolean(isSingle);
        singleCardStage.classList.toggle('is-hidden', !singleMode);
        fourCardsGrid.classList.toggle('is-hidden', singleMode);
        oneCardBtn.classList.toggle('is-active', singleMode);
        fourCardsBtn.classList.toggle('is-active', !singleMode);
        alarmBombPanel.classList.toggle('is-hidden', !singleMode);
        if (!singleMode) {
          resetClock();
        }
        drawCards();
      }

      function labelFromFilename(file) {
        return file
          .replace(/^questions-/, '')
          .replace(/\.json$/, '')
          .split('-')
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(' ');
      }

      function extractPromptText(row) {
        if (typeof row === 'string') return row;
        if (row && typeof row === 'object') {
          return row.question || row.prompt || row.text || row.title || '';
        }
        return '';
      }

      async function loadAllPrompts() {
        const collected = [];
        for (const file of DATA_FILES) {
          try {
            const resp = await fetch('./data/' + file, { cache: 'no-store' });
            if (!resp.ok) continue;
            const json = await resp.json();
            const entries = Array.isArray(json) ? json : (Array.isArray(json.questions) ? json.questions : []);
            const fallbackCat = labelFromFilename(file);
            for (const entry of entries) {
              const text = extractPromptText(entry).trim();
              if (text) {
                collected.push({
                  category: (entry && entry.category) || fallbackCat,
                  question: text
                });
              }
            }
          } catch (_) {
            // Skip unavailable file
          }
        }
        prompts = collected;
        statusLine.textContent = prompts.length
          ? prompts.length + ' conversation prompts ready.'
          : 'No prompts loaded from data/ folder.';
        drawCards();
      }

      function currentPool() {
        const chosen = categorySelect.value;
        if (chosen === 'all') return prompts;
        const target = labelFromFilename(chosen).toLowerCase();
        const filtered = prompts.filter((item) => String(item.category).toLowerCase() === target);
        return filtered.length ? filtered : prompts;
      }

      function sampleItems(pool, amount) {
        const bag = pool.slice();
        const out = [];
        while (out.length < amount && bag.length > 0) {
          const i = Math.floor(Math.random() * bag.length);
          out.push(bag.splice(i, 1)[0]);
        }
        return out;
      }

      function drawCards() {
        const pool = currentPool();
        if (!pool.length) return;

        if (singleMode) {
          const [picked] = sampleItems(pool, 1);
          singleCategory.textContent = picked.category;
          singleQuestion.textContent = picked.question;
          return;
        }

        const four = sampleItems(pool, 4);
        fourCardsGrid.innerHTML = '';
        four.forEach((item) => {
          const card = document.createElement('article');
          card.className = 'topic-card';

          const pill = document.createElement('span');
          pill.className = 'category-pill';
          pill.textContent = item.category;

          const q = document.createElement('p');
          q.className = 'topic-text';
          q.textContent = item.question;

          card.appendChild(pill);
          card.appendChild(q);
          fourCardsGrid.appendChild(card);
        });
      }

      startPauseClockBtn.addEventListener('click', () => {
        if (alarmClock.classList.contains('is-broken')) {
          resetClock();
        }
        if (running) {
          stopClockInterval();
          return;
        }
        if (leftSec <= 0) {
          leftSec = durationSec;
        }
        running = true;
        startPauseClockBtn.textContent = 'Pause';
        const startedAt = performance.now();
        const startLeft = leftSec;

        intervalRef = setInterval(() => {
          const elapsed = (performance.now() - startedAt) / 1000;
          leftSec = Math.max(0, startLeft - elapsed);
          renderClockState();
          if (leftSec <= 0) {
            explodeClock();
          }
        }, 100);
      });

      minusFiveBtn.addEventListener('click', () => changeDuration(durationSec - 5));
      plusFiveBtn.addEventListener('click', () => changeDuration(durationSec + 5));
      resetClockBtn.addEventListener('click', resetClock);
      rebuildClockBtn.addEventListener('click', resetClock);

      presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => changeDuration(Number(btn.dataset.sec)));
      });

      oneCardBtn.addEventListener('click', () => applyMode(true));
      fourCardsBtn.addEventListener('click', () => applyMode(false));
      drawPromptBtn.addEventListener('click', drawCards);
      nextSingleBtn.addEventListener('click', () => {
        drawCards();
        resetClock();
      });
      categorySelect.addEventListener('change', drawCards);

      renderClockState();
      loadAllPrompts();
    })();
  </script>
</body>
</html>
